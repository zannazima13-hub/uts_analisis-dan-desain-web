<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo-group">
            <div class="logo-box">
                <img src="logo form.png" alt="logo formnya">
            </div>
            <span class="logo-text">Sistem Pendaftaran Mahasiswa</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="login.html">Login</a>
            <a href="daftar.html" class="active">Daftar</a>
        </nav>
    </header>

    <!-- Konten Utama Form -->
    <main class="main-content">
        <h1 class="page-heading">Daftar</h1>

        <form action="login.html" method="get">
            <div class="form-daftar">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>

                <label for="confirm_pass">Ulangi Password</label>
                <input type="password" id="confirm_pass" name="confirm_pass" placeholder="Ulangi password Anda" required>

                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contoh: nama@email.com" required>

                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat lengkap (jalan, nomor rumah, RT/RW)" required></textarea>

                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 08123456789" required>

                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
                    <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                </div>

                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan" required>
                    <!-- Placeholder pada elemen dropdown select -->
                    <option value="" disabled selected>Pilih Jurusan</option>
                    <option value="Manajemen Informatika">Manajemen Informatika</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                </select>

                <label for="foto">Foto Profil</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>
            

            <!-- Tombol Aksi: Daftar ke login.html, Kembali ke index.html -->
            <div class="btn-group">
                <button type="submit" class="btn">Daftar</button>
                <a href="index.html" class="btn">Kembali</a>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-left">
            &copy; 2026 m.fauzan azima &mdash; 2557401003 &middot; Kelas MI 25.
        </div>
        <div class="footer-right">
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="mailto:email@example.com">Email</a>
        </div>
    </footer>

</body>
</html>
