<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo-group">
            <div class="logo-box">
                <img src="logo form.png" alt="logo formnya">
            </div>
            <span class="logo-text">Sistem Pendaftaran Mahasiswa</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="login.html" class="active">Login</a>
            <a href="daftar.html">Daftar</a>
        </nav>
    </header>

    <!-- Konten Utama: Fieldset Box Login -->
    <main class="main-content">
        <fieldset class="login-box">
            <legend>Login</legend>

            <form action="profil.html" method="get">
                <div class="form-login-grid">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username Anda" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password Anda" required>

                    <div class="checkbox-row">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                </div>
                <!-- Tombol Aksi: Login ke profil.html, Kembali ke index.html -->
                <div class="btn-group">
                    <button type="submit" class="btn">Login</button>
                    <a href="index.html" class="btn">Kembali</a>
                </div>
            </form>
        </fieldset>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-left">
            &copy; 2026 m.fauzan azima &mdash; 2557401003 &middot; Kelas MI 25
        </div>
        <div class="footer-right">
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="mailto:email@example.com">Email</a>
        </div>
    </footer>

</body>
</html>
